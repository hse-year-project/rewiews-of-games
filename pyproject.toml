[project]
name = "steam-pipeline"
version = "0.1.0"
description = "Steam reviews sentiment: data collection, parsing and cleaning"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lingua-language-detector>=2.2.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
]


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.uv.build-backend]
module-name = "src"   # the package is the src/ folder itself: `from src.db import read`
module-root = ""
